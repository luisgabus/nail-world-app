    <path d="M-20,-40 L35,-40 L55,-15 L-20,-15 Z" fill="#0ea5e9" opacity="0.6"/>
    <!-- Wheels -->
    <circle cx="-50" cy="40" r="22" fill="#1e293b"/>
    <circle cx="-50" cy="40" r="10" fill="#64748b"/>
    <circle cx="50" cy="40" r="22" fill="#1e293b"/>
    <circle cx="50" cy="40" r="10" fill="#64748b"/>
    <!-- Water drops -->
    <circle cx="-100" cy="-60" r="8" fill="white" opacity="0.7"/>
    <circle cx="-80" cy="-80" r="5" fill="white" opacity="0.5"/>
    <circle cx="100" cy="-60" r="8" fill="white" opacity="0.7"/>
    <circle cx="80" cy="-80" r="5" fill="white" opacity="0.5"/>
  </g>
</svg>
